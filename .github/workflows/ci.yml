name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: bash -n install.sh transcribe.sh
      - run: python -m compileall -q transcribe_faster_whisper.py test_transcribe.py
      - run: python -m unittest -v
      - run: pipx run ruff check transcribe_faster_whisper.py test_transcribe.py
